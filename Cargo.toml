[package]
name = "uc-intg-appletv"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MPL-2.0"
description = "Apple TV integration for Unfolded Circle Remote Two/3"
authors = ["Henrik Widlund"]
publish = false

[features]
default = ["mdns-sd"]
# mDNS service publishing. The Remote needs it to find the driver.
# Pure Rust, works on all platforms and in cross builds.
mdns-sd = ["dep:mdns-sd"]
# Allocation tests. They run alone:
# `cargo test --features dhat-heap dhat_ -- --ignored --test-threads=1`.
dhat-heap = ["dep:dhat"]

[dependencies]
uc_api = { git = "https://github.com/unfoldedcircle/api-model-rs", rev = "336beb1", features = ["prost"] }
ratv = { git = "https://github.com/henrikwidlund/ratv", rev = "c177245f790e84591035c22ecae02f809d493591", features = ["opus"] }

# WebSocket server
actix = "0"
actix-web = { version = "4", default-features = false, features = ["macros"] }
actix-ws = "0"
bytes = "1"
futures = { version = "0", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["fs", "macros", "sync", "time"] }
tokio-stream = { version = "0", features = ["sync"] }
prost = "0"

# mDNS publishing
hostname = "0"

# JSON (de)serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

rust-fsm = "0"
const_format = "0"
strum = { version = "0", features = ["derive"] }
thiserror = "2"
jiff = { version = "1", default-features = false, features = ["serde", "std"] }
bytestring = "1"
uuid = { version = "1", features = ["v4"] }

# Logging. ratv logs with tracing. The driver and other crates log with `log`: tracing-log
# forwards these records to the tracing subscriber.
tracing = { version = "0", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0", default-features = false, features = ["env-filter", "fmt", "parking_lot", "smallvec", "tracing-log"] }
tracing-log = { version = "0", default-features = false, features = ["log-tracer", "std"] }
log = "0"
mdns-sd = { version = "0", optional = true }
# Only for tests. A feature cannot enable a dev-dependency.
dhat = { version = "0", optional = true }

[dev-dependencies]
# Paused time in tests.
tokio = { version = "1", features = ["rt", "test-util"] }

[build-dependencies]
built = { version = "0", features = ["cargo-lock"] }

[lints.rust]
unsafe_code = "forbid"
non_ascii_idents = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
exit = "warn"
unwrap_used = "warn"
# Conflicts with the `unreachable_pub` lint.
redundant_pub_crate = "allow"
# `mul_add` is slow on CPUs without FMA.
suboptimal_flops = "allow"
# Duplicates come from dependencies.
multiple_crate_versions = "allow"
# Reports guards that are already dropped at the end of their block.
significant_drop_tightening = "allow"
# Needs `repository` and other fields that are not set.
cargo_common_metadata = "allow"
# The driver runs on one thread (actix), so futures do not need to be `Send`.
future_not_send = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# Actix handlers take messages by value.
needless_pass_by_value = "allow"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
