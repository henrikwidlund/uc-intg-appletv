# Check the default features: the build that is shipped.
[graph]
all-features = false
no-default-features = false

[advisories]
ignore = [
    #"RUSTSEC-0000-0000",
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained; uc_api needs it. Remove when uc_api no longer uses chrono" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
allow-workspace = false

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/unfoldedcircle/api-model-rs",
    "https://github.com/henrikwidlund/ratv",
]
