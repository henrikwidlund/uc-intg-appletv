[package]
name = "remote-sim"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Test program that acts as the Remote and tests the driver with a real Apple TV"
publish = false

# Not part of the driver build.
[workspace]

[dependencies]
ratv = { git = "https://github.com/henrikwidlund/ratv", rev = "c41987256c578dad604657f4d37f7e81285e3033", features = ["opus"] }
# The WebSocket client of the Remote. Without TLS: the driver is on ws://.
actix-ws-client = { git = "https://github.com/unfoldedcircle/actix-ws-client", rev = "b13926af70ab173343a7631960ade8ff51b81d1c", default-features = false }
actix = "0.13"
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
