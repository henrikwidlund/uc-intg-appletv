[package]
name = "remote-sim"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Test program that acts as the Remote and tests the driver with a real Apple TV"
publish = false

# Not part of the driver build.
[workspace]

[dependencies]
ratv = { git = "https://github.com/henrikwidlund/ratv", rev = "48cc6cdca0437ccaa52cba026d4759e62dbee205" }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "time"] }
tokio-tungstenite = "0.26"
