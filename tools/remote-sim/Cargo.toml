[package]
name = "remote-sim"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Test program that acts as the Remote and tests the driver with a real Apple TV"
publish = false

# Not part of the driver build.
[workspace]

[dependencies]
ratv = { git = "https://github.com/henrikwidlund/ratv", rev = "b3537ec40990ad218d4b23e1e14cadd803f00e5d", features = ["opus"] }
# The WebSocket client of the Remote. Without TLS: the driver is on ws://.
actix-ws-client = { git = "https://github.com/unfoldedcircle/actix-ws-client", rev = "e3bf55bb19f06f5be5ab4b096500d6a3bbd1ad38", default-features = false }
actix = "0.13"
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
