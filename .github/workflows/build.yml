# Build the driver for the Remote and package it as a custom integration.
name: Build & Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - v[0-9]+.[0-9]+.[0-9]+*
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

# Prevent concurrent runs of this workflow for open pull requests.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  APP_NAME: uc-intg-appletv
  ARTIFACT_PREFIX: uc-intg-appletv-rs
  TARGET: aarch64-unknown-linux-gnu
  TARGET_ID: aarch64_unknown_linux_gnu
  TARGET_TRIPLE: aarch64-none-linux-gnu
  SDK_URL: https://github.com/unfoldedcircle/ucr2-toolchain/releases/download/v1.0.1/ucr2-aarch64-toolchain-1.0.1-noqt.tar.gz
  SDK_NAME: aarch64-buildroot-linux-gnu_sdk-buildroot
  SYSROOT_NAME: aarch64-buildroot-linux-gnu
  # Must match the linker in .cargo/config.toml.
  LINKER: ucr2-aarch64-none-linux-gnu-gcc

jobs:
  build:
    name: Remote build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # History of 200 should be more than enough to calculate commit count since last release tag.
          fetch-depth: 200
          persist-credentials: false

      - name: Fetch all tags to determine version
        run: |
          git fetch origin +refs/tags/*:refs/tags/*
          VERSION=$(git describe --match "v[0-9]*" --tags HEAD --always)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "ARTIFACT_NAME=${{ env.ARTIFACT_PREFIX }}-$VERSION-aarch64" >> $GITHUB_ENV

      - name: Install Rust
        run: rustup update stable && rustup default stable && rustup target add ${{ env.TARGET }}

      - name: Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ env.TARGET }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install the Remote toolchain
        run: |
          wget -qO- ${{ env.SDK_URL }} | tar -xz
          ./${{ env.SDK_NAME }}/relocate-sdk.sh
          # Remove a symlink that breaks the cargo build. If /usr becomes a real directory, rm fails
          # and shows that the SDK changed.
          rm ./${{ env.SDK_NAME }}/usr

      - name: Configure the linker
        run: |
          mkdir -p ~/.cargo/bin/
          cat >~/.cargo/bin/${{ env.LINKER }} <<EOL
          #!/bin/bash
          \$GITHUB_WORKSPACE/${{ env.SDK_NAME }}/bin/${{ env.TARGET_TRIPLE }}-gcc --sysroot=\$GITHUB_WORKSPACE/${{ env.SDK_NAME }}/${{ env.SYSROOT_NAME }}/sysroot "\$@"
          EOL
          chmod +x ~/.cargo/bin/${{ env.LINKER }}
          ${{ env.LINKER }} --version

      - name: Build
        run: |
          export SDK=$GITHUB_WORKSPACE/${{ env.SDK_NAME }}
          export CC_${{ env.TARGET_ID }}=$SDK/bin/${{ env.TARGET_TRIPLE }}-gcc
          export CXX_${{ env.TARGET_ID }}=$SDK/bin/${{ env.TARGET_TRIPLE }}-g++
          export AR_${{ env.TARGET_ID }}=$SDK/bin/${{ env.TARGET_TRIPLE }}-ar
          cargo build --locked --release --target=${{ env.TARGET }}

      - name: Package
        run: |
          mkdir -p $GITHUB_WORKSPACE/artifacts/bin
          cp target/${{ env.TARGET }}/release/${{ env.APP_NAME }} $GITHUB_WORKSPACE/artifacts/bin/driver
          # The Remote reads the version and date from the packaged driver.json.
          jq --arg version "${VERSION#v}" --arg date "$(date -u +%Y-%m-%d)" \
            '.version = $version | .release_date = $date' \
            resources/driver.json > $GITHUB_WORKSPACE/artifacts/driver.json
          cp LICENSE $GITHUB_WORKSPACE/artifacts/
          echo "$VERSION" > $GITHUB_WORKSPACE/artifacts/version.txt
          tar czvf $GITHUB_WORKSPACE/${{ env.ARTIFACT_NAME }}.tar.gz -C $GITHUB_WORKSPACE/artifacts .

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_NAME }}.tar.gz
          if-no-files-found: error
          retention-days: 3

  native:
    name: Native build (${{ matrix.os }} ${{ matrix.arch }})
    # Runs on main too, so tag builds can use the cache saved there.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux uses musl: the binary has no libc dependency and runs on any distribution.
          # The gnu arm64 target is not used, because .cargo/config.toml sets the Remote linker for it.
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            bin_ext: ""
          - os: linux
            arch: arm64
            runner: ubuntu-26.04-arm
            target: aarch64-unknown-linux-musl
            bin_ext: ""
          - os: macos
            arch: amd64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bin_ext: ""
          - os: macos
            arch: arm64
            runner: xcode-27
            target: aarch64-apple-darwin
            bin_ext: ""
          - os: windows
            arch: amd64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bin_ext: .exe
          - os: windows
            arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            bin_ext: .exe
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version in the binary comes from git describe.
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust
        run: rustup update stable && rustup default stable && rustup target add ${{ matrix.target }}

      - name: Use the system linker for build scripts
        # .cargo/config.toml sets the Remote linker for aarch64-unknown-linux-gnu. Build scripts
        # are built for the host, which is this target on an arm64 Linux runner.
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=cc" >> "$GITHUB_ENV"

      - name: Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        # Thin LTO and more codegen units build much faster. The binary is a bit larger, which only
        # matters for the Remote build.
        env:
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        env:
          NAME: uc-intg-appletv-${{ matrix.os }}-${{ matrix.arch }}
          RELEASE_DIR: target/${{ matrix.target }}/release
          BIN_EXT: ${{ matrix.bin_ext }}
        run: |
          mkdir pack
          cp "${RELEASE_DIR}/${{ env.APP_NAME }}${BIN_EXT}" LICENSE pack/
          if [ "${{ matrix.os }}" = "windows" ]; then
            (cd pack && 7z a -tzip "../${NAME}.zip" .)
          else
            tar czvf "${NAME}.tar.gz" -C pack .
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uc-intg-appletv-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            uc-intg-appletv-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
            uc-intg-appletv-${{ matrix.os }}-${{ matrix.arch }}.zip
          if-no-files-found: ignore
          retention-days: 3

  release:
    name: GitHub release
    if: contains(github.ref, 'tags/v')
    needs: [build, native]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2

      - name: Collect artifacts
        run: |
          # Artifacts are extracted into one directory each.
          for D in *; do if [ -d "$D" ]; then mv "$D"/* ./; fi; done
          ls -lah

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # Tags with a suffix, for example v0.1.0-beta.1, are pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            *.tar.gz
            *.zip

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            *.tar.gz
            *.zip
